<!doctype html>
<html lang="en">
  <head>

  <body>
  <body style="margin: 0; padding: 0">
    <!-- header 本身固定在最頂端 -->
   <header
  class="site-header"
  style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 125px; /* 💡 固定頂端列大一倍後的高度 */
    background-color: #5692f8;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* 稍微加深陰影，符合大區塊的視覺 */
    z-index: 9999;
    box-sizing: border-box;
  "
>
  <div
    class="header-container"
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 100%; /* 撐滿 header */
      padding: 30px 60px;
      box-sizing: border-box;
    "
  >
    <a href="index.html" class="home-logo-btn">
      <img
        src="image5/P1-傳送門.png"
        alt="返回首頁"
        style="height: 65px; width: auto; display: block;"
      />
    </a>

    <nav class="main-nav" style="display: flex; gap: 30px">
  
  <a href="#contact" style="text-decoration: none; color: #ffffff; font-weight: bold; font-size: 22px;">Contact</a>
</nav>
  </div>
</header>

<section class="contact-section" id="contact" style="
  width: 100%; 
  height: 90px; 
  background-color: #f5f5f5; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  box-sizing: border-box;
">

  <!-- 內部容器：維持圖文並列與水平垂直置中 -->
  <div class="contact-container" style="
    display: flex; 
    flex-direction: row; 
    align-items: center; 
    justify-content: center; 
    font-size: 20px; 
    color: #333333;
  ">
    
    <!-- 👈 1. Instagram 圖標 (另開分頁) -->
    <!-- 💡 請記得將 href 改成你真正的 IG 網址 -->
    <a href="https://www.instagram.com/felicity_flyfly?xtok=bGV1Z2J5dGQ0aTlu" target="_blank" rel="noopener noreferrer" style="
      display: inline-flex;
      align-items: center;
      color: #333333; 
      text-decoration: none; 
      transition: opacity 0.2s;
    " onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
      <!-- 純 HTML 畫出的官方 Instagram SVG 圖標 -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display: block;">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
      </svg>
    </a>

    <!-- 💡 空格：間距拉開 -->
    <span style="margin-left: 20px;"></span>

    <!-- 📝 2. 中間的主要文字 -->
    <span style="font-weight: 500; line-height: 1;">Reach me on Instagram or email</span>

    <!-- 💡 空格：間距拉開 -->
    <span style="margin-left: 20px;"></span>

    <!-- 👉 3. 信箱圖標 (自動帶入信箱並另開分頁) -->
    <!-- 💡 請記得將 href="mailto:..." 改成你真實的電子信箱 -->
    <a href="sandycowfish88@gmail.com" target="_blank" style="
      display: inline-flex;
      align-items: center;
      color: #333333; 
      text-decoration: none; 
      transition: opacity 0.2s;
    " onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
      <!-- 純 HTML 畫出的優雅信封 SVG 圖標 -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
        <polyline points="22,6 12,13 2,6"></polyline>
      </svg>
    </a>

  </div>
</section>

</html>
